name: Manual Ingestion

on:
  workflow_dispatch:
    inputs:
      entities:
        description: "Comma-separated entity names (e.g. inside_totals_by_candidate)"
        required: true
      cycle:
        description: "Cycle year, if applicable (e.g. 2024)"
        required: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
      TEST_DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
      FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install poetry
      - run: poetry install --no-interaction --no-ansi --only main --no-root
      - name: Run manual ingestion
        run: |
          poetry run python -m civic_lantern.jobs.ingestion \
            --entities "${{ inputs.entities }}" \
            ${{ inputs.cycle && format('--cycle {0}', inputs.cycle) || '' }}
