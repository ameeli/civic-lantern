name: Nightly FEC Ingestion

on:
  schedule:
    - cron: "0 10 * * *" # 10:00 UTC daily (2am PST / 3am PDT) — fixed, no DST adjustment
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
      FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install poetry
      - run: poetry install --no-interaction --no-ansi --only main --no-root
      - name: Run nightly ingestion
        run: poetry run python -m civic_lantern.jobs.ingestion
      # Runs even if ingestion failed: some entities may still have committed new data.
      - name: Revalidate the frontend's cached FEC data
        if: always()
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: >-
          curl --fail-with-body --silent --show-error
          --retry 3 --retry-all-errors
          -X POST -H "Authorization: Bearer $REVALIDATE_SECRET"
          "$FRONTEND_URL/api/revalidate"
