name: Nightly FEC Ingestion

on:
  schedule:
    - cron: "0 10 * * *" # 10:00 UTC daily (2am PST / 3am PDT) — fixed, no DST adjustment
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
      TEST_DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
      FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install poetry
      - run: poetry install --no-interaction --no-ansi --only main --no-root
      - name: Run nightly ingestion
        run: poetry run python -m civic_lantern.jobs.ingestion
